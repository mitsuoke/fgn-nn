name: UAGS canary self cleanup

on:
  create:

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    if: >-
      github.event.ref_type == 'branch' &&
      startsWith(github.event.ref, 'uags/site-pr/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for canary proof closure and delete branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.event.ref }}
        run: |
          set -euo pipefail

          if [[ ! "$BRANCH" =~ ^uags/site-pr/[0-9a-f]{12}$ ]]; then
            echo "Unexpected canary branch: $BRANCH" >&2
            exit 64
          fi

          pr_number=""
          for attempt in $(seq 1 30); do
            pr_number="$(
              gh api "repos/$REPO/pulls?state=all&head=$OWNER:$BRANCH&base=main&per_page=100" \
                --jq '.[0].number // empty' 2>/dev/null || true
            )"
            if [[ -n "$pr_number" ]]; then
              break
            fi
            sleep 3
          done

          if [[ -n "$pr_number" ]]; then
            state=""
            for attempt in $(seq 1 240); do
              state="$(
                gh api "repos/$REPO/pulls/$pr_number" \
                  --jq '.state' 2>/dev/null || true
              )"
              if [[ "$state" == "closed" ]]; then
                break
              fi
              sleep 5
            done

            if [[ "$state" != "closed" ]]; then
              gh api --method PATCH "repos/$REPO/pulls/$pr_number" \
                -f state=closed >/dev/null
            fi

            final_state="$(
              gh api "repos/$REPO/pulls/$pr_number" --jq '.state'
            )"
            if [[ "$final_state" != "closed" ]]; then
              echo "Canary PR cleanup could not be verified." >&2
              exit 65
            fi
          fi

          gh api --method DELETE \
            "repos/$REPO/git/refs/heads/$BRANCH" >/dev/null

          if gh api "repos/$REPO/branches/$BRANCH" \
            >/dev/null 2>&1; then
            echo "Canary branch still exists after delete." >&2
            exit 66
          fi

          echo "UAGS canary cleanup verified."
